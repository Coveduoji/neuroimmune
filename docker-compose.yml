# 神经免疫 工作台 · 单机自托管部署
# 用法：
#   cp .env.example .env    # 填 NEUROIMMUNE_ADMIN_PASSWORD / NEUROIMMUNE_API_TOKEN 等
#   docker compose up -d --build
# 数据持久化在命名卷 neuroimmune-data（挂到 backend 的 /data）。

version: "3.8"   # 兼容老版 docker-compose v1（CentOS 7 默认只有 v1）；新版 v2 忽略此字段

services:
  backend:
    image: neuroimmune-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
      network: host   # 构建期用宿主网络（本机代理在 127.0.0.1:7890，容器内需直通宿主）
    environment:
      NEUROIMMUNE_DATA_DIR: /data
      NEUROIMMUNE_ADMIN_USER: ${NEUROIMMUNE_ADMIN_USER:-admin}
      NEUROIMMUNE_ADMIN_PASSWORD: ${NEUROIMMUNE_ADMIN_PASSWORD:-}
      NEUROIMMUNE_JWT_SECRET: ${NEUROIMMUNE_JWT_SECRET:-}
      NEUROIMMUNE_API_TOKEN: ${NEUROIMMUNE_API_TOKEN:-}
      NEUROIMMUNE_SYSLOG_BIND: ${NEUROIMMUNE_SYSLOG_BIND:-0.0.0.0}
      NEUROIMMUNE_SYSLOG_PORT: ${NEUROIMMUNE_SYSLOG_PORT:-5514}
      # 模型接入（可选，空 = mock 模式跑通架构）
      NEUROIMMUNE_API_KEY: ${NEUROIMMUNE_API_KEY:-}
      NEUROIMMUNE_BASE_URL: ${NEUROIMMUNE_BASE_URL:-}
      NEUROIMMUNE_MODEL: ${NEUROIMMUNE_MODEL:-}
      NEUROIMMUNE_DEEP_MODEL: ${NEUROIMMUNE_DEEP_MODEL:-}
      NEUROIMMUNE_LOG_LEVEL: ${NEUROIMMUNE_LOG_LEVEL:-INFO}
    volumes:
      - neuroimmune-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    expose:
      - "8000"
    # syslog 接收：默认 0.0.0.0 对外收日志（仅本机收改回 127.0.0.1 并注释掉端口映射）
    ports:
      - "5514:5514/udp"
      - "5514:5514/tcp"

  nginx:
    image: neuroimmune-nginx:latest
    build:
      context: .
      dockerfile: frontend/Dockerfile
      network: host   # 构建期用宿主网络（同上）
    ports:
      - "80:80"
      # - "443:443"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  neuroimmune-data:
